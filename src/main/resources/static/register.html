<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro - Eventia</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:20px} .container{max-width:600px;margin:0 auto;background:white;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)} h2{color:#333} label{display:block;margin-top:10px;font-weight:bold} input,select{width:100%;padding:8px;margin-top:4px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box} button{width:100%;margin-top:16px;background:#4CAF50;color:white;padding:12px;border:none;border-radius:4px;cursor:pointer;font-size:16px;font-weight:bold} button:hover{background:#45a049} pre{background:#f9f9f9;padding:10px;border-radius:4px;overflow-x:auto;margin-top:16px;font-size:12px} .success{color:#4CAF50} .error{color:#f44336} .info{background:#e3f2fd;padding:10px;border-radius:4px;margin-bottom:15px;color:#1565c0}</style>
</head>
<body>
  <div class="container">
    <h2>Registro de Usuario</h2>
    <div class="info">Todos los campos son obligatorios. Tu rol será asignado como USUARIO automáticamente.</div>
    <form id="form">
      <label>Nombres <input name="nombres" required></label>
      <label>Apellidos <input name="apellidos" required></label>
      <label>RUT <input name="rut" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Contraseña <input name="password" type="password" required minlength="6"></label>
      <label>Fecha de Nacimiento <input name="fechaNacimiento" type="date" required></label>
      <label>Género <select name="genero" required><option value="">Selecciona...</option><option value="M">Masculino</option><option value="F">Femenino</option><option value="O">Otro</option></select></label>
      <label>Ciudad <input name="ciudad" required></label>
      <label>Celular <input name="celular" required></label>
      <button type="submit">Registrar como USUARIO</button>
    </form>
    <pre id="out"></pre>
  </div>

  <script>
  const out = document.getElementById('out');
  document.getElementById('form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = JSON.stringify({
      nombres: fd.get('nombres'),
      apellidos: fd.get('apellidos'),
      rut: fd.get('rut'),
      email: fd.get('email'),
      password: fd.get('password'),
      fechaNacimiento: fd.get('fechaNacimiento'),
      genero: fd.get('genero'),
      ciudad: fd.get('ciudad'),
      celular: fd.get('celular')
    });

    try{
      const res = await fetch('/api/auth/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body,
        credentials: 'include'
      });
      const json = await res.json();
      if (res.ok) {
        out.innerHTML = '<span class="success">✓ Registro exitoso. Redireccionando...</span>';
        setTimeout(() => window.location.href = '/home.html', 1500);
      } else {
        out.innerHTML = '<span class="error">✗ Error: ' + (json.error || 'Desconocido') + '</span>';
      }
    }catch(err){ out.textContent = 'Error: '+err; }
  });
  </script>
</body>
</html>
