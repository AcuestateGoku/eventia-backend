<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Eventia</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; background-color: #f5f5f5; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #333; text-align: center; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; background-color: #2196F3; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #0b7dda; }
    pre { background-color: #f9f9f9; padding: 10px; border-radius: 4px; overflow-x: auto; margin-top: 16px; }
    .success { color: #4CAF50; }
    .error { color: #f44336; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Iniciar Sesión</h2>
    <form id="form">
      <label>Email <input name="email" type="email" required></label>
      <label>Contraseña <input name="password" type="password" required></label>
      <button type="submit">Entrar</button>
    </form>
    <pre id="out"></pre>
  </div>

  <script>
  const out = document.getElementById('out');
  document.getElementById('form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = JSON.stringify({
      email: fd.get('email'),
      password: fd.get('password')
    });

    try{
      const res = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body,
        credentials: 'include'
      });
      const json = await res.json();
      if (res.ok) {
        out.innerHTML = '<span class="success">✓ Login exitoso. Redireccionando...</span>';
        setTimeout(() => window.location.href = '/home.html', 1500);
      } else {
        out.innerHTML = '<span class="error">✗ ' + (json.error || 'Credenciales inválidas') + '</span>';
      }
    }catch(err){ out.textContent = 'Error: '+err }
  });
  </script>
</body>
</html>
