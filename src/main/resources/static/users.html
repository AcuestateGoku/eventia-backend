<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Usuarios - Debug</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:20px} table{border-collapse:collapse;width:100%} th,td{border:1px solid #ddd;padding:8px}</style>
</head>
<body>
  <h2>Usuarios (debug)</h2>
  <button id="load">Cargar usuarios</button>
  <div id="out"></div>

  <script>
  document.getElementById('load').addEventListener('click', async ()=>{
    const out = document.getElementById('out');
    out.textContent = 'Cargando...';
    try{
      const res = await fetch('/api/debug/users', { credentials: 'include' });
      const json = await res.json();
      if (!Array.isArray(json)) { out.textContent = JSON.stringify(json, null, 2); return; }

      let html = '<table><thead><tr><th>ID</th><th>Nombres</th><th>Email</th><th>Role</th><th>FechaRegistro</th></tr></thead><tbody>';
      json.forEach(u=>{
        html += `<tr><td>${u.id}</td><td>${u.nombres || ''}</td><td>${u.email || ''}</td><td>${u.role || ''}</td><td>${u.fechaRegistro || ''}</td></tr>`;
      });
      html += '</tbody></table>';
      out.innerHTML = html;
    }catch(err){ out.textContent = 'Error: '+err }
  });
  </script>
</body>
</html>
