spring.application.name=eventia-backend

# Configuración para MySQL local. Actualiza usuario/clave si tu MySQL usa otros valores.
spring.datasource.url=jdbc:mysql://localhost:3306/eventia
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Puerto de la aplicación
server.port=8080

# NOTA: Si prefieres otra BD, modifica estas propiedades acorde a tu entorno.